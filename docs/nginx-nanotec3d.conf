server {
    listen 80;
    listen [::]:80;
    server_name nanotec3d.clubemkt.digital;

    root /ClubeMkt/nanotec-realestate/dist;
    index index.html;

    # hashed assets can be cached hard
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
